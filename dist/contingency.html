<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contingency</title>
<meta name="description" content="A personal injury law firm tycoon. Run every case from intake to disbursement and grow from a solo practice into a dynasty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Contingency: layout concept is a case-management workstation. A fixed top ledger bar, a left rail of departments, and a work surface of flat panels. Case files slide in from the right like a folder pulled from a cabinet. */
:root {
  --topbar-h: 62px;
  --bg: #eef0f3;            /* cool paper */
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --fg: #1b2330;            /* ink */
  --muted: #5c6878;
  --line: #d6dbe3;
  --accent: #2f6b4f;        /* banker's lamp green */
  --accent-fg: #ffffff;
  --brass: #9a7b2f;         /* money */
  --warn: #b7791f;
  --danger: #b3362a;
  --good: #2f6b4f;
  --info: #35618f;
  --stamp: #b3362a;
  --font-ui: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 4px;
  --shadow: 0 1px 2px rgba(20, 30, 45, 0.08), 0 8px 24px rgba(20, 30, 45, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a22; --surface: #1c2430; --surface-2: #222c39; --fg: #e4e8ee; --muted: #9aa6b5; --line: #303c4b;
    --accent: #5aa37f; --accent-fg: #0f1b15; --brass: #d4b265; --warn: #e0a33b; --danger: #e06a5d; --good: #5aa37f; --info: #6fa3d8; --stamp: #e06a5d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a22; --surface: #1c2430; --surface-2: #222c39; --fg: #e4e8ee; --muted: #9aa6b5; --line: #303c4b;
  --accent: #5aa37f; --accent-fg: #0f1b15; --brass: #d4b265; --warn: #e0a33b; --danger: #e06a5d; --good: #5aa37f; --info: #6fa3d8; --stamp: #e06a5d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 14px; } h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
p { margin: 0; }
a { color: var(--info); }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
input[type="range"] { padding: 0; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.num, .money, td.num, .kpi-value, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.good { color: var(--good); } .warn { color: var(--warn); } .danger { color: var(--danger); } .info { color: var(--info); } .brass { color: var(--brass); }
.hidden-el { display: none !important; }

/* App frame */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.topbar .brand { display: flex; flex-direction: column; min-width: 0; }
.topbar .brand .firm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.topbar .brand .tier { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.topbar .stat { display: flex; flex-direction: column; min-width: 90px; }
.topbar .stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.topbar .stat .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }
.topbar .controls { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.repbar { width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.repbar > span { display: block; height: 100%; background: var(--brass); }

.body { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--topbar-h, 62px); align-self: start; max-height: calc(100vh - var(--topbar-h, 62px)); overflow: auto; z-index: 10; }
.rail button { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: transparent; border-radius: var(--radius); cursor: pointer; color: var(--fg); }
.rail button:hover { background: var(--surface-2); }
.rail button.active { background: var(--accent); color: var(--accent-fg); }
.rail button .badge { background: var(--stamp); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 9px; font-family: var(--font-mono); }
.rail button.active .badge { background: var(--accent-fg); color: var(--accent); }
.content { padding-block: 18px; padding-inline: 20px; min-width: 0; max-width: 1300px; width: 100%; }
.content > section { display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head p { max-width: 70ch; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn .cost { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.btn.primary .cost { color: var(--accent-fg); opacity: 0.8; }
.btn.urgent { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.speed button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Panels and grids */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel h3 { margin-bottom: 10px; }
.panel.flush { padding: 0; overflow: hidden; }
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.kpi .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.kpi .kpi-value { font-size: 20px; font-weight: 600; margin-top: 2px; }
.kpi .kpi-sub { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: var(--danger); }
.kpi.alert .kpi-value { color: var(--danger); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.num, th.num { text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { color: var(--good); border-color: var(--good); background: transparent; }
.chip.warn { color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.chip.info { color: var(--info); border-color: var(--info); background: transparent; }
.chip.stamp { color: var(--stamp); border: 2px solid var(--stamp); border-radius: 2px; text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; padding: 1px 5px; transform: rotate(-3deg); }
.stage-pill { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface-2); border: 1px solid var(--line); }
.stage-investigation { color: var(--info); } .stage-treatment { color: var(--warn); } .stage-records { color: var(--muted); } .stage-demand { color: var(--brass); } .stage-negotiation { color: var(--brass); } .stage-litigation { color: var(--danger); } .stage-disbursement { color: var(--good); } .stage-closed { color: var(--good); } .stage-lost, .stage-dropped { color: var(--muted); }

.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.meter.warn > span { background: var(--warn); } .meter.danger > span { background: var(--danger); } .meter.brass > span { background: var(--brass); }
.skill { display: grid; grid-template-columns: 90px 1fr 18px; gap: 8px; align-items: center; font-size: 12px; }
.skill .dots { display: flex; gap: 2px; }
.skill .dots i { width: 8px; height: 8px; border-radius: 1px; background: var(--line); display: block; }
.skill .dots i.on { background: var(--accent); }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.urgent { border-left: 4px solid var(--danger); }
.card.attention { border-left: 4px solid var(--warn); }
.card h3 { margin: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* Timeline and log */
.timeline { display: flex; flex-direction: column; gap: 0; font-size: 13px; }
.timeline .entry { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.timeline .entry .when { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.timeline .entry.good .what { color: var(--good); } .timeline .entry.bad .what { color: var(--danger); } .timeline .entry.warn .what { color: var(--warn); } .timeline .entry.stage .what { font-weight: 600; } .timeline .entry.offer .what { color: var(--brass); font-weight: 600; }

/* Pipeline */
.pipeline { display: flex; gap: 2px; flex-wrap: wrap; }
.pipeline .step { flex: 1 1 90px; padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface-2); border: 1px solid var(--line); text-align: center; color: var(--muted); }
.pipeline .step.done { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); opacity: 0.6; }
.pipeline .step.now { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }

/* Slide-over case file */
.overlay { position: fixed; inset: 0; background: rgba(10, 15, 22, 0.45); z-index: 30; display: flex; justify-content: flex-end; }
.overlay[hidden] { display: none; }
.drawer { width: min(860px, 100%); height: 100%; background: var(--bg); overflow-y: auto; box-shadow: var(--shadow); padding-block: 16px; padding-inline: 18px; display: flex; flex-direction: column; gap: 14px; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.drawer-head .title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.drawer-head h2 { font-size: 20px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }

/* Modal */
.modal-root { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(10, 15, 22, 0.55); padding: 16px; }
.modal-root[hidden] { display: none; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.modal.wide { width: min(900px, 100%); }
.modal h2 { font-size: 19px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.options button { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; white-space: normal; align-items: flex-start; width: 100%; }
.options button .desc { font-size: 12px; color: var(--muted); font-weight: 400; }
.options button.primary .desc { color: var(--accent-fg); opacity: 0.85; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.amount-input { display: flex; gap: 8px; align-items: center; }
.amount-input input { font-family: var(--font-mono); font-size: 18px; width: 200px; }

/* New game */
.newgame { max-width: 960px; margin: 0 auto; padding-block: 30px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
.newgame .masthead { display: flex; flex-direction: column; gap: 8px; }
.newgame .masthead h1 { font-size: 34px; letter-spacing: -0.01em; }
.newgame .masthead .sub { color: var(--muted); max-width: 70ch; font-size: 15px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; white-space: normal; align-items: flex-start; }
.choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice .name { font-weight: 600; }
.choice .desc { font-size: 12px; color: var(--muted); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.form-row input { font-size: 15px; }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 4px; z-index: 50; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

canvas.chart { width: 100%; height: 160px; display: block; }

.lead-card .narrative { font-size: 13px; }
.flags { display: flex; gap: 4px; flex-wrap: wrap; }
.offer-table td { padding: 5px 8px; }

@media (max-width: 860px) {
  .body { grid-template-columns: 1fr; }
  .rail { position: sticky; top: var(--topbar-h, 62px); align-self: stretch; max-height: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; gap: 4px; }
  .body { grid-template-rows: max-content 1fr; }
  .rail button { width: auto; padding: 7px 10px; white-space: nowrap; gap: 6px; }
  .content { padding-inline: 16px; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
  .topbar .stat { min-width: 70px; }
  .topbar .brand .firm { max-width: 180px; }
  .form-row { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { margin-top: 4px; }
  .timeline .entry { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .chip.stamp { transform: none; } }

</style>
</head>
<body>
<div id="app"></div>
<div id="drawer-root" hidden></div>
<div id="modal-root" class="modal-root" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Contingency: utilities, RNG, formatting. Everything hangs off a single global namespace (PI). */
(function () {
  const PI = (globalThis.PI = globalThis.PI || {});

  // Seeded RNG (mulberry32). The seed state lives in game state so saves are reproducible.
  let _s = 123456789;
  const rng = {
    seed(v) { _s = v >>> 0; },
    state() { return _s; },
    next() {
      _s = (_s + 0x6D2B79F5) >>> 0;
      let t = _s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    chance(p) { return rng.next() < p; },
    int(lo, hi) { return lo + Math.floor(rng.next() * (hi - lo + 1)); },
    range(lo, hi) { return lo + rng.next() * (hi - lo); },
    pick(arr) { return arr[Math.floor(rng.next() * arr.length)]; },
    weighted(items) {
      // items: [{w, v}] or objects with .weight
      let total = 0;
      for (const it of items) total += (it.w != null ? it.w : it.weight) || 0;
      let r = rng.next() * total;
      for (const it of items) {
        r -= (it.w != null ? it.w : it.weight) || 0;
        if (r <= 0) return it.v !== undefined ? it.v : it;
      }
      const last = items[items.length - 1];
      return last.v !== undefined ? last.v : last;
    },
    gauss(mean, sd) {
      let u = 0, v = 0;
      while (u === 0) u = rng.next();
      while (v === 0) v = rng.next();
      return mean + sd * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    },
    lognormal(median, sigma) {
      return median * Math.exp(rng.gauss(0, sigma));
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng.next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  };
  PI.rng = rng;

  PI.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  PI.round = (v, step) => Math.round(v / step) * step;
  PI.sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);

  let _uid = 1;
  PI.uid = (prefix) => `${prefix || 'id'}_${(_uid++).toString(36)}_${Math.floor(Math.random() * 1e6).toString(36)}`;

  PI.money = function (n, opts) {
    opts = opts || {};
    const neg = n < 0;
    const a = Math.abs(n);
    let s;
    if (opts.short) {
      if (a >= 1e9) s = (a / 1e9).toFixed(2) + 'B';
      else if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
      else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k';
      else s = Math.round(a).toString();
    } else {
      s = Math.round(a).toLocaleString('en-US');
    }
    return (neg ? '-$' : '$') + s;
  };
  PI.pct = (v, d) => (v * 100).toFixed(d == null ? 0 : d) + '%';

  // Game calendar: day 0 = Monday, January 1, 2024. Weeks are 7 days.
  const EPOCH = Date.UTC(2024, 0, 1);
  PI.dateOf = (day) => new Date(EPOCH + day * 86400000);
  PI.fmtDate = function (day, long) {
    const d = PI.dateOf(day);
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    if (long) {
      const full = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return `${full[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
    }
    return `${months[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
  };
  PI.yearOf = (day) => PI.dateOf(day).getUTCFullYear();
  PI.monthOf = (day) => PI.dateOf(day).getUTCMonth();
  PI.weeksToText = function (weeks) {
    if (weeks < 0) weeks = 0;
    if (weeks < 8) return `${weeks} wk${weeks === 1 ? '' : 's'}`;
    const m = Math.round(weeks / 4.33);
    if (m < 18) return `${m} mo`;
    return `${(weeks / 52).toFixed(1)} yr`;
  };
  PI.daysToText = function (days) {
    if (days <= 0) return 'expired';
    if (days < 14) return `${days} days`;
    return PI.weeksToText(Math.round(days / 7));
