    for (const c of state.cases) if (c.attorneyId === id && C.isOpen(c)) { c.attorneyId = F.leastLoaded(state).id; C.log(state, c, `Reassigned to ${F.staffById(state, c.attorneyId).name} after ${st.name} left the firm.`); }
    for (const s of state.staff) if (!s.isFounder) s.morale -= 4;
    F.log(state, `${st.name} let go with ${PI.money(severance)} severance.`);
  };
  F.raise = function (state, id, pct) {
    const st = F.staffById(state, id);
    if (!st || st.isFounder) return;
    st.salary = Math.round(st.salary * (1 + pct) / 500) * 500;
    st.morale = Math.min(100, st.morale + pct * 150);
    st.lastRaiseDay = state.day;
    F.log(state, `${st.name} received a ${Math.round(pct * 100)}% raise to ${PI.money(st.salary)}.`);
  };
  F.bonus = function (state, id, amount) {
    const st = F.staffById(state, id);
    if (!st) return;
    F.spend(state, amount, `Bonus: ${st.name}`, 'payroll');
    st.morale = Math.min(100, st.morale + amount / 400);
  };
  F.train = function (state, id, skillKey) {
    const st = F.staffById(state, id);
    if (!st) return { ok: false };
    const cost = 2500 + st.trained * 1500;
    if (state.cash < cost) return { ok: false, msg: 'Not enough cash.' };
    if (st.skills[skillKey] >= 10) return { ok: false, msg: 'Already at the top of the scale.' };
    F.spend(state, cost, `Training: ${st.name} (${skillKey})`, 'overhead');
    st.trained++;
    st.skills[skillKey]++;
    st.morale = Math.min(100, st.morale + 3);
    F.log(state, `${st.name} completed advanced training. ${skillKey} is now ${st.skills[skillKey]}.`);
    return { ok: true };
  };
  F.promote = function (state, id) {
    const st = F.staffById(state, id);
    if (!st || st.isPartner || !(st.role === 'attorney' || st.role === 'trial')) return;
    st.isPartner = true;
    st.title = 'Partner';
    st.salary = Math.round(st.salary * 1.35 / 1000) * 1000;
    st.morale = 100;
    F.log(state, `${st.name} made partner.`, 'stage');
    F.achieve(state, 'partner', 'Made your first partner.');
  };
  F.assignCase = function (state, caseId, attId) {
    const c = state.cases.find((x) => x.id === caseId);
    const att = F.staffById(state, attId);
    if (!c || !att) return;
    c.attorneyId = attId;
    C.log(state, c, `Reassigned to ${att.name}.`);
  };

  F.weeklyStaff = function (state) {
    for (const st of state.staff) {
      if (st.isFounder) continue;
      // Morale baseline drift.
      const officeBonus = D.OFFICES[state.office].rep * 0.03;
      st.morale += officeBonus - 0.2;
      if (state.staff.length > F.officeCap(state)) st.morale -= 1.5;
      if (st.lastRaiseDay && state.day - st.lastRaiseDay > 365 * 1.5) st.morale -= 0.3;
      st.morale = PI.clamp(st.morale, 0, 100);
      if (st.morale < 20 && R.chance(0.08)) {
        state.staff = state.staff.filter((s) => s.id !== st.id);
        F.recount(state);
        for (const c of state.cases) if (c.attorneyId === st.id && C.isOpen(c)) { c.attorneyId = F.leastLoaded(state).id; }
        F.log(state, `${st.name} quit. "I can't do this caseload anymore."`, 'bad');
      }
    }
  };

  // ---------- Money ----------
  F.monthlyOverhead = function (state) {
    const payroll = state.staff.reduce((a, s) => a + s.salary, 0) / 12 + (state.founderDraw || 0);
    const rent = D.OFFICES[state.office].rent * state.city.costOfLiving + state.offices.length * 9000;
    const marketing = Object.keys(state.marketing).reduce((a, k) => a + (D.CHANNELS[k].cost * (state.marketing[k] || 0)), 0);
    const atts = F.attorneys(state).length;
    const insurance = state.policy.insured ? (atts * 6500 * (state.modifiers.premiumMult || 1)) / 12 : 0;
    const software = state.staff.length * 180 + 400;
    const benefits = (payroll - (state.founderDraw || 0)) * 0.18;
    const cfo = state.staffCounts.cfo ? 0.92 : 1;
    return { payroll: payroll + benefits, rent, marketing, insurance, software, total: (payroll + benefits + rent + marketing + insurance + software) * cfo };
  };
  F.weeklyExpenses = function (state) {
    const o = F.monthlyOverhead(state);
    const weekly = o.total / 4.33;
    F.spend(state, Math.round(weekly), 'Weekly overhead (payroll, rent, marketing, insurance)', 'overhead');
    if (state.debt > 0) { const interest = Math.round(state.debt * (state.staffCounts.cfo ? 0.075 : 0.095) / 52); F.spend(state, interest, 'Line of credit interest', 'interest'); }
    state.creditLimit = Math.round((60000 + state.reputation * 1500 + state.tier * 120000 + Math.min(2000000, state.stats.feesEarned * 0.08)) / 5000) * 5000;
    // Auto-draw to cover payroll.
    if (state.cash < 0 && state.debt < state.creditLimit) {
      const draw = Math.min(state.creditLimit - state.debt, Math.ceil(-state.cash / 5000) * 5000);
      state.debt += draw; state.cash += draw;
      F.log(state, `Drew ${PI.money(draw)} on the line of credit to cover overhead.`, 'warn');
    }
  };
  F.borrow = function (state, amt) { amt = Math.min(amt, state.creditLimit - state.debt); if (amt <= 0) return; state.debt += amt; state.cash += amt; state.ledger.unshift({ day: state.day, amount: amt, label: 'Line of credit draw', cat: 'loan' }); };
  F.repay = function (state, amt) { amt = Math.min(amt, state.debt, state.cash); if (amt <= 0) return; state.debt -= amt; state.cash -= amt; state.ledger.unshift({ day: state.day, amount: -amt, label: 'Line of credit repayment', cat: 'loan' }); };

  F.setChannel = function (state, chId, level) {
    const ch = D.CHANNELS[chId];
    if (!ch || ch.passive) return { ok: false };
    if (ch.unlockTier && state.tier < ch.unlockTier) return { ok: false, msg: `Unlocks at ${D.TIERS[ch.unlockTier].name}.` };
    level = PI.clamp(level, 0, ch.maxLevel);
    if (!state.marketing[chId] && level > 0) state.channelSince[chId] = state.week;
    if (level === 0) delete state.marketing[chId]; else state.marketing[chId] = level;
    if (ch.rep && level > (state.marketing[chId] || 0)) F.adjustRep(state, ch.rep * 0.2);
    return { ok: true };
  };
  F.upgradeOffice = function (state, tier) {
    const o = D.OFFICES[tier];
    if (!o || tier === state.office) return { ok: false };
    if (tier === 5 && state.tier < 4) return { ok: false, msg: 'A named tower requires a statewide brand.' };
    const moveCost = tier > state.office ? Math.round(o.rent * 3 * state.city.costOfLiving) : Math.round(D.OFFICES[state.office].rent * 1.5);
    if (state.cash < moveCost) return { ok: false, msg: `Moving costs ${PI.money(moveCost)} (deposit and build-out).` };
    F.spend(state, moveCost, `Office move: ${o.name}`, 'overhead');
    const up = tier > state.office;
    state.office = tier;
    if (up) { F.adjustRep(state, o.rep * 0.5); for (const s of state.staff) s.morale = Math.min(100, s.morale + 8); }
    F.log(state, `Moved into ${o.name.toLowerCase()}.`, 'stage');
    return { ok: true };
  };
  F.openOffice = function (state, cityId) {
    if (state.tier < 2) return { ok: false, msg: 'A second office unlocks at Established firm.' };
    if (cityId === state.cityId || state.offices.find((o) => o.cityId === cityId)) return { ok: false, msg: 'Already there.' };
    const cost = 60000;
    if (state.cash < cost) return { ok: false, msg: `Opening a satellite office costs ${PI.money(cost)}.` };
    F.spend(state, cost, `Opened office in ${D.CITIES.find((c) => c.id === cityId).name}`, 'overhead');
    state.offices.push({ cityId, openedDay: state.day });
    F.adjustRep(state, 3);
    F.log(state, `Opened a satellite office in ${D.CITIES.find((c) => c.id === cityId).name}.`, 'stage');
    F.news(state, `${state.firmName} expands to ${D.CITIES.find((c) => c.id === cityId).name}.`);
    return { ok: true };
  };

  // ---------- Monthly and yearly ----------
  F.monthly = function (state) {
    F.refreshCandidates(state);
    const o = F.monthlyOverhead(state);
    const fees = state.ledger.filter((l) => l.cat === 'fees' && l.day > state.day - 30).reduce((a, l) => a + l.amount, 0);
    F.log(state, `Month closed. Fees ${PI.money(fees)}, overhead ${PI.money(o.total)}, cash ${PI.money(state.cash)}${state.debt ? `, debt ${PI.money(state.debt)}` : ''}.`);
    // Reputation drifts slowly toward what the firm is actually doing.
    const avgSat = state.stats.satN ? state.stats.satSum / state.stats.satN : 60;
    const target = 15 + Math.min(35, state.stats.resolved * 0.25) + (avgSat - 60) * 0.6 + state.stats.trialWins * 1.5 + D.OFFICES[state.office].rep + state.offices.length * 3 + (state.marketing.tv || 0) * 2 + (state.marketing.billboard || 0) + (state.marketing.sponsorship || 0) * 2;
    state.reputation += (PI.clamp(target, 0, 100) - state.reputation) * 0.05;
    const acceptRatio = state.stats.acceptN ? state.stats.acceptRatioSum / state.stats.acceptN : 0.85;
    const filedRate = state.stats.resolved ? (state.stats.settledLit + state.stats.trials) / state.stats.resolved : 0.1;
    const crTarget = PI.clamp(30 + (acceptRatio - 0.85) * 120 + filedRate * 40 + state.stats.trialWins * 2 - state.stats.trialLosses, 0, 100);
    state.carrierRep = PI.clamp((state.carrierRep == null ? 30 : state.carrierRep) + (crTarget - state.carrierRep) * 0.06, 0, 100);
    for (const k of Object.values(state.carriers || {})) k.credibility *= 0.97;
  };
  F.yearly = function (state, closedYear) {
    const fees = state.ledger.filter((l) => l.cat === 'fees' && l.day > state.day - 365).reduce((a, l) => a + l.amount, 0);
    const resolved = state.cases.filter((c) => c.closedDay && c.closedDay > state.day - 365 && c.stage === 'closed').length;
    state.yearbook.push({ year: closedYear, fees: Math.round(fees), resolved, staff: state.staff.length, cash: Math.round(state.cash), rep: Math.round(state.reputation), tier: state.tier });
    for (const s of state.staff) { s.age++; if (!s.isFounder && (!s.lastRaiseDay || state.day - s.lastRaiseDay > 365)) { s.morale -= 6; } }
    const f = F.founder(state);
    F.log(state, `${closedYear} in review: ${PI.money(fees)} in fees, ${resolved} cases resolved, ${state.staff.length} on staff. ${f.name} turns ${f.age}.`, 'stage');
    if (f.age >= 58 && !state.successorId && state.tier >= 2) F.log(state, `${f.name} is ${f.age}. The firm needs a succession plan: name a partner as successor on the Firm tab.`, 'warn');
    if (f.age >= 70) F.retireFounder(state);
    if (state.modifiers.premiumMult && state.modifiers.premiumMult > 1) state.modifiers.premiumMult = Math.max(1, state.modifiers.premiumMult * 0.85);
  };

  // ---------- Dynasty ----------
  F.nameSuccessor = function (state, id) {
    const st = F.staffById(state, id);
    if (!st || !st.isPartner || st.isFounder) return { ok: false, msg: 'Successor must be a partner.' };
    state.successorId = id;
    F.log(state, `${st.name} named successor and managing partner-in-waiting.`, 'stage');
    F.achieve(state, 'successor', 'Named a successor.');
    return { ok: true };
  };
  F.retireFounder = function (state) {
    const f = F.founder(state);
    const succ = F.staffById(state, state.successorId);
    if (!succ) {
      if (f.age >= 72) { state.gameOver = { kind: 'dissolved', text: `${f.name} retired at ${f.age} with no successor. The firm was dissolved and its cases referred out. Legacy score: ${F.legacy(state).toLocaleString()}.` }; return; }
      F.log(state, `${f.name} wants to retire but has no successor. Name a partner before it is too late.`, 'bad');
      return;
    }
    f.isFounder = false; f.title = 'Of counsel (retired)'; f.salary = 0;
    f.retiredDay = state.day;
    state.retired.push({ name: f.name, years: PI.yearOf(state.day) - PI.yearOf(f.hiredDay), generation: state.generation });
    succ.isFounder = true; succ.title = 'Managing partner'; succ.salary = 0; succ.morale = 100;
    state.successorId = null;
    state.generation++;
    state.founderName = succ.name;
    F.log(state, `${f.name} retired. ${succ.name} takes over as managing partner. Generation ${state.generation} of the firm begins.`, 'stage');
    F.news(state, `${state.firmName} announces leadership transition to ${succ.name}.`);
    F.adjustRep(state, -3);
    state.staff = state.staff.filter((s) => s !== f);
    F.recount(state);
    for (const c of state.cases) if (c.attorneyId === f.id && C.isOpen(c)) { c.attorneyId = succ.id; }
  };
  F.retireNow = function (state) { const f = F.founder(state); if (f.age < 55) return { ok: false, msg: 'Too young to retire.' }; F.retireFounder(state); return { ok: true }; };
  F.legacy = function (state) {
    return Math.round(state.stats.feesEarned / 1000 + state.stats.recovered / 5000 + state.stats.trialWins * 2000 + state.stats.resolved * 50 + state.tier * 20000 + (state.generation - 1) * 50000 + state.reputation * 200);
  };

  // ---------- Progression ----------
  F.checkTier = function (state) {
    const next = D.TIERS[state.tier + 1];
    if (!next) return;
    if (F.tierProgress(state, next).every((r) => r.met)) {
      state.tier++;
      F.adjustRep(state, 5);
      F.log(state, `The firm is now a ${next.name.toLowerCase()}. ${next.desc} Unlocked: ${next.unlocks.join(', ')}.`, 'stage');
      F.news(state, `${state.firmName} grows into a ${next.name.toLowerCase()}.`);
      for (const s of state.staff) s.morale = Math.min(100, s.morale + 10);
    }
  };
  F.tierProgress = function (state, tier) {
    const r = tier.req;
    const out = [];
    const add = (label, have, need, fmt) => out.push({ label, have, need, met: have >= need, text: `${fmt ? fmt(have) : have} / ${fmt ? fmt(need) : need}` });
    if (r.staff) add('Staff', state.staff.length, r.staff);
    if (r.fees) add('Lifetime fees', state.stats.feesEarned, r.fees, (v) => PI.money(v, { short: true }));
    if (r.resolved) add('Cases resolved', state.stats.resolved, r.resolved);
    if (r.office) add('Office tier', state.office, r.office, (v) => D.OFFICES[Math.min(v, 5)].name);
    if (r.trials) add('Trial wins', state.stats.trialWins, r.trials);
    if (r.offices) add('Locations', state.offices.length + 1, r.offices);
    if (r.verdict) add('Largest verdict', state.stats.biggestVerdict, r.verdict, (v) => PI.money(v, { short: true }));
    if (r.successor) out.push({ label: 'Successor named', have: state.successorId || state.generation > 1 ? 1 : 0, need: 1, met: !!(state.successorId || state.generation > 1), text: state.successorId || state.generation > 1 ? 'Yes' : 'No' });
    return out;
  };
  F.checkAchievements = function (state) {
    const s = state.stats;
    if (s.resolved >= 1) F.achieve(state, 'first', 'First case resolved.');
    if (s.biggestSettlement >= 100000) F.achieve(state, 'sixfig', 'First six-figure recovery.');
    if (s.biggestSettlement >= 1000000) F.achieve(state, 'sevenfig', 'First seven-figure recovery.');
    if (s.trialWins >= 1) F.achieve(state, 'trial', 'First plaintiff\'s verdict.');
    if (s.biggestVerdict >= 10000000) F.achieve(state, 'eightfig', 'Eight-figure verdict.');
    if (state.staff.length >= 10) F.achieve(state, 'ten', 'Ten people on payroll.');
    if (state.staff.length >= 50) F.achieve(state, 'fifty', 'Fifty people on payroll.');
    if (s.feesEarned >= 10000000) F.achieve(state, 'tenm', 'Ten million dollars in lifetime fees.');
    if (state.offices.length >= 1) F.achieve(state, 'expand', 'Opened a second office.');
    if (state.generation >= 2) F.achieve(state, 'dynasty', 'A second generation leads the firm.');
    if (state.tier >= 5) F.achieve(state, 'national', 'National dynasty.');
  };
  F.checkGameOver = function (state) {
    if (state.gameOver) return;
    if (state.cash < 0 && state.debt >= state.creditLimit) {
      state.insolventWeeks = (state.insolventWeeks || 0) + 1;
      if (state.insolventWeeks === 1) F.log(state, 'The firm cannot make payroll and the line of credit is maxed. Settle something or cut costs within eight weeks.', 'bad');
      if (state.insolventWeeks >= 8) state.gameOver = { kind: 'bankrupt', text: `${state.firmName} could not make payroll for two months. The bank called the line, the landlord changed the locks and the cases were referred out. Legacy score: ${F.legacy(state).toLocaleString()}.` };
    } else state.insolventWeeks = 0;
  };

  // ---------- Events ----------
  F.EVENTS = {
    kickback: { title: 'A chiropractor wants a deal', w: 6, cond: (s) => s.week > 8, text: 'Dr. Pruitt runs three clinics and says he can send you forty cases a year. All he wants is $400 "marketing reimbursement" per patient. It is a kickback with a new name.', options: [{ label: 'Take the deal', desc: 'Leads up sharply. Bar risk.' }, { label: 'Decline politely', desc: 'Reputation +1.' }] },
    tv_feature: { title: 'Local news wants an interview', w: 5, cond: (s) => s.stats.resolved >= 3, text: 'A reporter is doing a segment on dangerous intersections and wants a lawyer on camera.', options: [{ label: 'Do the interview', desc: 'Reputation and a burst of leads.' }, { label: 'Pass', desc: 'No effect.' }] },
    poach: { title: 'Competitor poaching', w: 6, cond: (s) => s.staff.length >= 3, text: '{name} just got a call from a billboard firm across town offering 30% more.', options: [{ label: 'Match the offer', desc: 'Salary +30%, morale up.' }, { label: 'Wish them luck', desc: '60% chance they leave.' }] },
    tort_reform: { title: 'Tort reform bill', w: 2, cond: (s) => s.week > 52 && !s.modifiers.tortReformUntil, text: 'The legislature is voting on a cap on non-economic damages. The trial lawyers\' association is asking every firm for $25,000 for the lobbying fight.', options: [{ label: 'Contribute $25,000', desc: '70% chance the bill dies.' }, { label: 'Sit it out', desc: '60% chance it passes: verdicts and reserves down 15% for three years.' }] },
    bar_audit: { title: 'Trust account audit', w: 3, cond: (s) => s.week > 26, text: 'The state bar selected the firm for a random IOLTA trust account audit.', options: [{ label: 'Hire a CPA to prepare ($4,000)', desc: 'Almost certainly clean.' }, { label: 'Hand over the books as they are', desc: 'Risk of a fine if the ledgers are sloppy.' }] },
    hurricane: { title: 'Hurricane warning', w: 3, cond: (s) => s.cityId === 'gulfshore' || s.cityId === 'portavalon', text: 'A Category 3 storm is bearing down on the coast. Courts will close.', options: [{ label: 'Batten down', desc: 'Courts closed for four weeks. Premises leads surge afterward.' }] },
    mass_tort: { title: 'Mass tort steering committee', w: 2, cond: (s) => s.tier >= 3 && !s.modifiers.massTortDue, text: 'A plaintiffs\' steering committee on a defective hip implant MDL is offering seats at $150,000 each. Payouts, if any, are two years out.', options: [{ label: 'Buy in ($150,000)', desc: 'Returns between 0.3x and 6x in about two years.' }, { label: 'Pass', desc: '' }] },
    big_referral: { title: 'A referral from the courthouse', w: 4, cond: (s) => s.reputation > 25, text: 'A divorce lawyer you met at a CLE has a client whose husband was killed by a tractor-trailer. She does not do PI and is sending the family to you.', options: [{ label: 'Take the call', desc: 'A catastrophic trucking lead with a 25% referral fee owed.' }] },
    social_breach: { title: 'Client posted the settlement', w: 3, cond: (s) => s.stats.resolved >= 5, text: 'A former client posted a photo of their settlement check, with the confidential amount, on social media. The carrier is demanding $15,000 in liquidated damages under the confidentiality clause.', options: [{ label: 'Pay it from firm funds', desc: '$15,000, client relationship preserved.' }, { label: 'Fight it', desc: '50% chance it goes away; otherwise $25,000 and a reputation hit.' }] },
    burnout: { title: 'Burnout', w: 5, cond: (s) => s.staff.length >= 2, text: '{name} came into your office and closed the door. "I have not had a weekend in three months."', options: [{ label: 'Give a $3,000 bonus and a week off', desc: 'Morale restored.' }, { label: 'Tell them it is a sprint', desc: 'Morale drops.' }] },
    adjuster_defects: { title: 'An adjuster wants to switch sides', w: 3, cond: (s) => s.tier >= 1, text: 'A twelve-year claims adjuster from Redline Auto Casualty applied for a job. She knows exactly how the valuation software works.', options: [{ label: 'Interview her', desc: 'Adds a high-negotiation candidate to the pool.' }] },
    google_update: { title: 'Search algorithm update', w: 3, cond: (s) => (s.marketing.seo || 0) >= 2, text: 'Overnight the firm dropped from page one to page four for every search that matters.', options: [{ label: 'Pay an agency $10,000 to recover', desc: 'Fixed quickly.' }, { label: 'Wait it out', desc: 'Search leads halved for six months.' }] },
    award: { title: 'Rising Star award', w: 3, cond: (s) => s.reputation > 40 && !s.achievements.find((a) => a.id === 'award'), text: 'A legal magazine named you to its Rising Stars list. They would like to sell you a plaque.', options: [{ label: 'Buy the plaque ($1,200)', desc: 'Reputation +3.' }, { label: 'Just post about it', desc: 'Reputation +1.' }] },
    runner: { title: 'A "runner" offers hospital clients', w: 3, cond: (s) => s.week > 20, text: 'A man who says he works hospital parking lots offers to send injured patients your way for $1,000 each. This is solicitation and it is illegal.', options: [{ label: 'Hire him', desc: 'Lots of leads. Real chance of suspension.' }, { label: 'Throw him out', desc: 'Nothing happens.' }] },
    recession: { title: 'Recession', w: 2, cond: (s) => s.week > 40 && !s.modifiers.recessionUntil, text: 'Markets fell 20% and carriers are tightening reserves. Expect lower offers for a year.', options: [{ label: 'Acknowledge', desc: 'Offers down 10% for 12 months.' }] },
    founder_health: { title: 'Health scare', w: 2, cond: (s) => F.founder(s).age >= 52, text: 'Chest pains during a deposition. The cardiologist says stress. Six weeks of reduced hours.', options: [{ label: 'Follow doctor\'s orders', desc: 'Founder capacity reduced for six weeks.' }] },
    cle_invite: { title: 'Invited to speak at a CLE', w: 4, cond: (s) => s.stats.resolved >= 8, text: 'The county bar wants a one-hour talk on time-limited demands. Every lawyer in the room is a potential referral source.', options: [{ label: 'Give the talk', desc: 'Attorney referral network grows by one level.' }, { label: 'Decline', desc: '' }] },
    bar_hearing: { title: 'Disciplinary hearing', w: 0, cond: () => false, text: 'Three bar complaints in a short span triggered a formal hearing. The panel is considering a suspension.', options: [{ label: 'Retain ethics counsel ($20,000)', desc: '80% chance of a private reprimand only.' }, { label: 'Represent yourself', desc: '50% chance of a 90-day suspension.' }] },
    runner_caught: { title: 'Solicitation investigation', w: 0, cond: () => false, text: 'Your runner was arrested. He named every lawyer he worked with.', options: [{ label: 'Cooperate', desc: 'Suspension for 90 days, reputation hit.' }] },
    defense_verdict_press: { title: 'Carrier publicity', w: 2, cond: (s) => s.stats.trialLosses >= 1, text: 'A carrier\'s defense firm is bragging about beating you at trial in its newsletter.', options: [{ label: 'Respond with your verdict record', desc: 'Reputation +1 if you have trial wins; otherwise nothing.' }, { label: 'Ignore it', desc: '' }] },
    paralegal_catch: { title: 'Calendar catch', w: 3, cond: (s) => (s.staffCounts.paralegal || 0) >= 1, text: 'Your paralegal noticed a statute of limitations that was calendared on the wrong year. Caught with three weeks to spare.', options: [{ label: 'Buy lunch for the whole office ($300)', desc: 'Morale up across the firm.' }] }
  };
  F.queueEvent = function (state, id, extra) {
    const E = F.EVENTS[id];
    if (!E) return;
    let text = E.text;
    let target = null;

    const days = l.expiresDay - s.day;
    const est = C.estimate(s, l);
    const atts = F.attorneys(s);
    const liab = l.known.liability ? { clear: chip('Liability looks clear', 'good'), disputed: chip('Liability disputed', 'warn'), weak: chip('Liability weak', 'danger') }[l.liability.bucket] : chip('Liability unverified');
    const ins = l.known.uninsured ? chip('Defendant uninsured', 'danger') : l.known.insurer ? chip(D.INSURERS.find((i) => i.id === l.defendant.insurer).name, 'info') : chip('Carrier unknown');
    const limits = l.known.limits ? chip(`Limits ${M(l.defendant.limits, { short: true })}`, 'info') : '';
    const um = l.known.um ? chip(l.client.umLimit ? `UM/UIM ${M(l.client.umLimit, { short: true })}` : 'No UM coverage', l.client.umLimit ? 'good' : 'warn') : '';
    const health = l.known.health ? chip({ none: 'Uninsured (LOP treatment)', private: 'Private health plan', erisa: 'ERISA plan', medicare: 'Medicare', medicaid: 'Medicaid' }[l.client.health]) : '';
    return `<div class="card lead-card ${days <= 3 ? 'urgent' : ''}">
      <div class="row between"><div><h3>${h(l.clientName)} <span class="muted small">· ${l.clientAge}, ${h(l.occupation)}</span></h3><div class="small muted">${h(T.name)} · ${h(SEV_LABEL[l.severity])} injury · via ${h(D.CHANNELS[l.channel].name.toLowerCase())}</div></div>
        <div class="row"><span class="chip ${days <= 3 ? 'danger' : ''}">${days <= 0 ? 'Leaving today' : `Decides in ${days} day${days === 1 ? '' : 's'}`}</span>${solChip(s, l)}</div></div>
      <p class="narrative">${h(l.clientName.split(' ')[0])} was ${h(l.narrative)} on ${h(date(l.incidentDay))}. Reports ${h(l.injury)}.${l.flags.includes('comp') && l.known.flags.includes('comp') ? ' Was on the job at the time.' : ''}</p>
      <div class="flags">${liab}${ins}${limits}${um}${health}${flagChips(l)}</div>
      ${(() => { const att = F.leastLoaded(s); const ld = s.loads && s.loads[att.id]; const fee = est.mid * 0.333; const costs = 150 + l.severity * 250 + (T.expertRequired ? 25000 : 0); const hours = 12 + l.severity * 14 + (l.liability.bucket === 'weak' ? 20 : 0); const loadPct = ld ? Math.round(ld.need / ld.cap * 100) : 0; return `<div class="small muted">Economics: fee around <span class="mono">${M(fee, { short: true })}</span> if it settles at value · costs to advance ~<span class="mono">${M(costs, { short: true })}</span> · roughly ${hours} attorney-hours · ${h(att.name)} is at <span class="${loadPct > 100 ? 'danger' : loadPct > 80 ? 'warn' : ''}">${loadPct}% load</span>${l.liability.bucket === 'weak' && l.known.liability ? ' · <span class="danger">weak liability cases rarely settle without suit</span>' : ''}${l.known.limits && l.defendant.limits < est.mid ? ' · <span class="warn">value exceeds policy limits</span>' : ''}</div>`; })()}
      <div class="row between">
        <span class="small muted">Rough value <span class="mono">${M(est.lo, { short: true })} to ${M(est.hi, { short: true })}</span> · ${l.investigated ? 'investigated' : 'based on the intake call only'}</span>
        <div class="actions">
          ${atts.length > 1 ? `<select data-role="assign-${l.id}" aria-label="Assign attorney">${atts.map((a) => `<option value="${a.id}">${h(a.name)}${a.isFounder ? ' (you)' : ''}</option>`).join('')}</select>` : ''}
          ${btn('sign-lead', 'Sign', { arg: l.id, cls: 'primary sm' })}
          ${l.investigated ? '' : btn('investigate-lead', 'Investigate', { arg: l.id, cls: 'sm', cost: 150, title: 'Pull the crash report, run the carrier and check the client\'s history before signing.' })}
          ${btn('refer-lead', 'Refer out', { arg: l.id, cls: 'sm', title: 'Send to another firm for a 25% referral fee when it resolves.' })}
          ${btn('decline-lead', 'Decline', { arg: l.id, cls: 'sm ghost' })}
        </div></div>
    </div>`;
  };
  U.tabIntake = function (s) {
    const leads = s.leads.slice().sort((a, b) => a.expiresDay - b.expiresDay);
    return `
      <div class="page-head"><h1>Intake</h1><p>Every caller is a potential client and a potential disaster. Screen for liability, damages and coverage. Capacity ${Math.floor(F.intakeCapacity(s))} at a time; ${s.stats.leadsLost} callers lost to voicemail so far.</p></div>
      <div class="row between"><div class="row"><label class="row small"><input type="checkbox" data-act="policy" data-arg="autoIntake" ${s.policy.autoIntake ? 'checked' : ''}> Let intake staff sign and decline automatically</label></div><span class="small muted">Signed ${s.stats.signed} · Declined ${s.stats.declined}</span></div>
      ${leads.length ? `<div class="list">${leads.map((l) => U.leadCard(s, l)).join('')}</div>` : `<div class="empty">No leads waiting. Marketing brings callers; reputation and happy clients bring the good ones.</div>`}`;
  };

  // ---------- Cases ----------
  U.tabCases = function (s) {
    const f = U.caseFilter;
    const filters = [['attention', 'Needs decision', U.pendingCases(s).length], ['open', 'All open', F.openCases(s).length], ...['investigation', 'treatment', 'records', 'demand', 'negotiation', 'litigation', 'disbursement'].map((st) => [st, C.STAGE_NAMES[st], s.cases.filter((c) => c.stage === st).length]), ['closed', 'Closed', s.cases.filter((c) => c.stage === 'closed').length], ['ended', 'Lost or dropped', s.cases.filter((c) => ['lost', 'dropped'].includes(c.stage)).length]];
    let rows = s.cases.filter((c) => f === 'attention' ? (c.pending && !c.delegated && C.isOpen(c)) : f === 'open' ? C.isOpen(c) : f === 'ended' ? ['lost', 'dropped'].includes(c.stage) : c.stage === f);
    rows = rows.slice().sort((a, b) => (b.pending && !b.delegated ? 1 : 0) - (a.pending && !a.delegated ? 1 : 0) || a.solDay - b.solDay);
    return `
      <div class="page-head"><h1>Cases</h1><p>Click a file to open it. Delegated files are run by their assigned attorney; hands-on files wait for you.</p></div>
      <div class="row">${filters.map(([id, name, n]) => `<button class="btn sm ${f === id ? 'primary' : ''}" data-act="cases-filter" data-arg="${id}">${name} <span class="cost">${n}</span></button>`).join('')}</div>
      ${rows.length ? `<div class="panel flush table-wrap"><table>
        <thead><tr><th>Client</th><th>Matter</th><th>Stage</th><th>Treatment</th><th>Attorney</th><th class="num">Est. value</th><th class="num">Offer</th><th>Client</th><th>Deadline</th><th>Status</th></tr></thead>
        <tbody>${rows.map((c) => { const est = C.estimate(s, c); const closed = !C.isOpen(c); return `<tr class="clickable" data-act="open-case" data-arg="${c.id}">
          <td><strong>${h(c.clientName)}</strong><div class="small muted">${h(SEV_LABEL[c.severity])} · ${closed ? `closed ${h(date(c.closedDay || c.createdDay))}` : `${Math.round((s.day - (c.signedDay || c.createdDay)) / 7)} wks open`}</div></td>
          <td>${h(D.CASE_TYPES[c.type].short)}<div class="small muted">${h(c.injury)}</div></td>
          <td>${stagePill(c)}</td>
          <td style="min-width:120px">${closed ? `<span class="small muted">${c.settlement && c.settlement.early ? 'Settled pre-MMI' : 'MMI'}</span>` : (() => { const ts = C.treatmentStatus(c); return `<div class="small ${ts.kind}">${h(ts.label)}</div>${meter(ts.pct, ts.kind)}<div class="small muted mono">${M(C.specials(c), { short: true })} billed</div>`; })()}</td>
          <td>${h(attName(s, c.attorneyId))}${c.delegated ? `<div class="small muted">delegated</div>` : ''}</td>
          <td class="num">${closed && c.settlement ? M(c.settlement.gross) : `${M(est.lo, { short: true })}–${M(est.hi, { short: true })}`}</td>
          <td class="num">${c.negotiation && c.negotiation.currentOffer ? M(c.negotiation.currentOffer) : '—'}</td>
          <td style="min-width:90px">${closed ? (c.satisfaction != null ? `${c.satisfaction}/100` : '—') : meter(c.client.mood, moodKind(c.client.mood))}</td>
          <td>${closed ? '—' : solChip(s, c)}</td>
          <td>${c.pending && !c.delegated ? `<span class="chip stamp">${h(pendingLabel[c.pending.type])}</span>` : c.pending ? chip('Attorney deciding') : c.negotiation && c.negotiation.awaiting ? chip('Awaiting carrier') : ''}</td>
        </tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">No files here.</div>`}`;
  };

  // ---------- Case file drawer ----------
  U.renderDrawer = function () {
    const s = U.state;

    if (!c) { root.hidden = true; root.innerHTML = ''; return; }
    root.hidden = false;
    const T = D.CASE_TYPES[c.type];
    const est = C.estimate(s, c);
    const atts = F.attorneys(s);
    const open = C.isOpen(c);
    const stages = ['investigation', 'treatment', 'records', 'demand', 'negotiation', 'litigation', 'disbursement'];
    const idx = stages.indexOf(c.stage);
    const skipLit = c.stage === 'disbursement' && !(c.litigation && c.litigation.filed);
    const pipeline = stages.map((st, i) => `<div class="step ${c.stage === st ? 'now' : (i < idx && !(st === 'litigation' && skipLit)) ? 'done' : ''}">${h(C.STAGE_NAMES[st])}</div>`).join('');
    const actions = C.actions(s, c);
    const primary = actions.filter((a) => a.primary);
    const regular = actions.filter((a) => !a.primary && !a.group);
    const experts = actions.filter((a) => a.group === 'experts');
    const manage = actions.filter((a) => a.group === 'manage');
    const actBtn = (a) => btn('case-act', h(a.name), { arg: a.id, cls: `${a.primary ? 'primary' : ''} ${a.danger ? 'danger' : ''} ${a.urgent ? 'urgent' : ''}`, cost: a.cost, disabled: a.disabled || (a.cost > s.cash + (s.creditLimit - s.debt)), title: a.desc });
    const ins = D.INSURERS.find((i) => i.id === c.defendant.insurer);
    const adjStyle = c.defendant.adjusterStyle ? D.ADJUSTER_STYLES.find((x) => x.id === c.defendant.adjusterStyle) : null;
    const ev = c.liability.evidence;
    const evidence = [['policeReport', 'Police report'], ['photos', 'Photographs'], ['witnesses', 'Witness statements'], ['video', 'Video footage'], ['scene', 'Scene inspection'], ['blackbox', 'Event data recorder']].filter(([k]) => ev[k]).map(([, n]) => chip(n, 'good')).join('') || '<span class="muted small">None gathered yet</span>';
    const liabText = c.liability.determination ? { accepted: 'Carrier accepted liability', disputed: `Carrier disputes liability${c.liability.cf ? ` and asserts ${Math.round(c.liability.cf * 100)}% comparative fault` : ''}`, denied: 'Carrier denied liability' }[c.liability.determination] : 'Awaiting carrier position';
    const strength = C.effectiveLiability(c);
    const specials = C.specials(c);
    const lit = c.litigation;
    const n = c.negotiation;
    const st = c.settlement;
    const statement = st ? C.statement(s, c) : null;
    const feeOnEst = Math.round(est.mid * c.feePct);
    root.innerHTML = `<div class="overlay" data-act="close-drawer-bg"><div class="drawer" role="dialog" aria-label="Case file">
      <div class="drawer-head">
        <div class="title"><div class="row"><h2>${h(c.clientName)}</h2>${stagePill(c)}${c.delegated ? chip('Delegated', 'info') : ''}${c.pending && !c.delegated ? `<span class="chip stamp">${h(pendingLabel[c.pending.type])}</span>` : ''}</div>
          <div class="muted">${h(T.name)} · ${h(SEV_LABEL[c.severity])}: ${h(c.injury)} · Incident ${h(date(c.incidentDay))}${c.signedDay != null ? ` · Signed ${h(date(c.signedDay))}` : ''}</div></div>
        <div class="row">${open ? `<label class="small muted">Attorney <select data-act="assign-case" data-arg="${c.id}">${atts.map((a) => `<option value="${a.id}" ${a.id === c.attorneyId ? 'selected' : ''}>${h(a.name)}</option>`).join('')}</select></label>` : ''}${btn('close-drawer', 'Close')}</div>
      </div>
      <div class="pipeline">${pipeline}</div>
      ${primary.length ? `<div class="panel" style="border-color:var(--accent)"><div class="row between"><div><h3>Your decision</h3><p class="muted small">${h(primary[0].desc)}</p></div><div class="actions">${primary.map(actBtn).join('')}</div></div></div>` : ''}
      <div class="grid cols-3">
        <div class="panel"><h3>Value</h3>
          <dl class="kv"><dt>Estimate</dt><dd class="mono">${M(est.lo)} – ${M(est.hi)}</dd><dt>Fee at midpoint</dt><dd class="mono">${M(feeOnEst)} (${Math.round(c.feePct * 100)}%)</dd>${!c.treatment.mmi && C.isOpen(c) ? `<dt>Worked up fully</dt><dd class="mono" title="A rough read on what the case is worth once treatment is complete">${M(Math.round(C.potentialValue(s, c) * 0.8 / 1000) * 1000, { short: true })} – ${M(Math.round(C.potentialValue(s, c) * 1.2 / 1000) * 1000, { short: true })}</dd>` : ''}<dt>Billed medicals</dt><dd class="mono">${M(specials)}${c.treatment.mmi ? '' : ' so far'}</dd><dt>Wage loss</dt><dd class="mono">${M(c.wage)}</dd>${c.futureMeds ? `<dt>Future medicals</dt><dd class="mono">${M(c.futureMeds)}</dd>` : ''}<dt>Costs advanced</dt><dd class="mono">${M(c.costs)}</dd><dt>Collectible</dt><dd class="mono">${c.known.limits ? `${M(c.defendant.limits)}${c.defendant.umbrella ? ` + ${M(c.defendant.umbrella)} umbrella` : ''}` : c.known.uninsured ? 'Uninsured defendant' : 'Limits unknown'}${c.uim ? `<br>UIM claim open (${M(c.client.umLimit)})` : ''}</dd></dl>
        </div>
        <div class="panel"><h3>Liability</h3>
          <dl class="kv"><dt>Position</dt><dd>${h(liabText)}</dd><dt>Strength</dt><dd>${meter(strength * 100, strength < 0.5 ? 'danger' : strength < 0.75 ? 'warn' : '')}<span class="small muted">${strength > 0.85 ? 'Strong' : strength > 0.65 ? 'Good' : strength > 0.45 ? 'Contested' : 'Weak'}${c.liability.cf && c.known.liability ? ` · ${Math.round(c.liability.cf * 100)}% comparative fault alleged` : ''}</span></dd><dt>Evidence</dt><dd><div class="flags">${evidence}</div></dd><dt>Facts</dt><dd><div class="flags">${flagChips(c) || '<span class="muted small">Nothing notable yet</span>'}</div></dd></dl>
        </div>
        <div class="panel"><h3>Insurance</h3>
          <dl class="kv"><dt>Defendant</dt><dd>${h(c.defendant.name)}</dd><dt>Carrier</dt><dd>${c.known.uninsured ? '<span class="danger">None (uninsured)</span>' : c.known.insurer ? `${h(ins.name)}<div class="small muted">${h(ins.desc)}</div>` : 'Not yet confirmed'}</dd>${c.defendant.adjuster ? `<dt>Adjuster</dt><dd>${h(c.defendant.adjuster)}${adjStyle ? ` <span class="chip">${h(adjStyle.name)}</span><div class="small muted">${h(adjStyle.desc)}</div>` : ''}</dd>` : ''}<dt>Policy limits</dt><dd>${c.known.limits ? `<span class="mono">${M(c.defendant.limits)}</span>` : 'Not disclosed'}</dd><dt>Client's UM/UIM</dt><dd>${c.known.um ? (c.client.umLimit ? `<span class="mono">${M(c.client.umLimit)}</span>` : 'None') : 'Not reviewed'}${c.known.um && c.client.medpay ? ` · med-pay ${M(c.client.medpay)}${c.medpayUsed ? ' (used)' : ''}` : ''}</dd><dt>Health coverage</dt><dd>${c.known.health ? h({ none: 'None: treating on letters of protection', private: 'Private insurance (subrogation lien expected)', erisa: 'Self-funded ERISA plan', medicare: 'Medicare', medicaid: 'Medicaid' }[c.client.health]) : 'Not identified'}</dd></dl>
        </div>
      </div>
      <div class="grid cols-3">
        <div class="panel"><h3>Client</h3>
          <dl class="kv"><dt>Who</dt><dd>${h(c.clientName)}, ${c.clientAge}, ${h(c.occupation)}</dd><dt>Mood</dt><dd>${meter(c.client.mood, moodKind(c.client.mood))}<span class="small muted">${Math.round(c.client.mood)}/100 · last contact ${s.week - c.client.lastContactWeek} wk ago</span></dd><dt>Expectations</dt><dd>${c.client.expectations > 1.2 ? 'Unrealistic' : 'Reasonable'}</dd>${c.satisfaction != null ? `<dt>Satisfaction</dt><dd>${c.satisfaction}/100</dd>` : ''}</dl>
        </div>
        <div class="panel"><h3>Treatment</h3>
          ${(() => { const ts = C.treatmentStatus(c); return `<div class="row between small"><span class="${ts.kind}">${h(ts.label)}</span><span class="muted mono">${ts.pct}%</span></div>${meter(ts.pct, ts.kind)}`; })()}
          <div class="small muted" style="margin:6px 0">${c.treatment.mmi ? 'Reached maximum medical improvement.' : c.treatment.inGap ? '<span class="warn">Client is not currently treating (gap in care).</span>' : `Active treatment, about ${PI.weeksToText(Math.max(0, Math.round(c.treatment.weeksLeft)))} remaining.`}${c.treatment.gaps ? ` ${c.treatment.gaps} gap${c.treatment.gaps > 1 ? 's' : ''} in care.` : ''}${c.treatment.surgeryIndicated && !c.treatment.surgeryDone && !c.treatment.surgeryDeclined ? ' <span class="brass">Surgery recommended.</span>' : ''}</div>
          <table class="small">${c.treatment.plan.map((p) => `<tr><td>${h(p.name)}</td><td class="num">${p.billed ? M(p.billed) : '—'}</td><td class="small muted">${p.recordsReceived ? 'records in' : p.recordsRequested ? 'records requested' : p.done ? 'complete' : 'treating'}</td></tr>`).join('')}</table>
        </div>
        <div class="panel"><h3>Deadlines</h3>
          <dl class="kv"><dt>Statute</dt><dd>${h(date(c.solDay))} <div>${solChip(s, c)}</div></dd>${c.noticeDay ? `<dt>Notice of claim</dt><dd>${c.noticeServed ? chip('Served', 'good') : `${h(date(c.noticeDay))} ${chip('Not served', 'danger')}`}</dd>` : ''}${c.demand && c.demand.sent ? `<dt>Demand</dt><dd>${M(c.demand.amount)} on ${h(date(c.demand.sentDay))}${c.demand.timeLimited ? `<div class="small">Time-limited, deadline ${h(date(c.demand.deadlineDay))}${c.demand.blown ? ' <span class="good">(missed by carrier)</span>' : ''}</div>` : ''}</dd>` : ''}${lit && lit.filed ? `<dt>Suit filed</dt><dd>${h(date(lit.filedDay))}</dd>` : ''}</dl>
        </div>
      </div>
      ${lit && lit.filed ? `<div class="panel"><h3>Litigation</h3>
        <dl class="kv"><dt>Court</dt><dd>${h(lit.court)}, ${h(lit.judge)}</dd><dt>Defense</dt><dd>${h(lit.defenseFirm || 'Not yet appeared')}</dd><dt>Phase</dt><dd>${h(C.litStage(c).name)} ${meter(Math.min(100, lit.stageWeeks / Math.max(1, lit.stageNeed) * 100))}<span class="small muted">about ${PI.weeksToText(Math.max(0, Math.round((lit.stageNeed - lit.stageWeeks) / Math.max(0.2, c.speedLast))))} remaining at current pace</span></dd><dt>Experts</dt><dd>${lit.experts.length ? lit.experts.map((e) => chip(D.EXPERTS[e].name)).join(' ') : '<span class="muted">None retained</span>'}</dd>${lit.badFaith ? `<dt>Bad faith</dt><dd class="good">Carrier blew a policy-limits demand. Excess exposure is on the table.</dd>` : ''}${lit.ime ? `<dt>Defense IME</dt><dd class="warn">Defense examiner disputes causation</dd>` : ''}${lit.verdict ? `<dt>Verdict</dt><dd class="mono good">${M(lit.verdict)}</dd>` : ''}</dl></div>` : ''}
      ${n && n.offers && n.offers.length ? `<div class="panel"><h3>Negotiation</h3><div class="table-wrap"><table class="offer-table"><thead><tr><th>Date</th><th>From</th><th class="num">Amount</th><th>Note</th></tr></thead><tbody>${n.offers.slice().reverse().map((o) => `<tr><td>${h(date(o.day))}</td><td>${o.from === 'firm' ? 'Firm' : o.from === 'defense' ? 'Defense counsel' : h(c.defendant.adjuster || 'Adjuster')}</td><td class="num ${o.from === 'firm' ? '' : 'brass'}">${o.amount ? M(o.amount) : 'No offer'}</td><td class="small muted">${h(o.note || '')}</td></tr>`).join('')}</tbody></table></div>${n.awaiting ? '<p class="small muted" style="margin-top:6px">Waiting on the carrier\'s response.</p>' : ''}</div>` : ''}
      ${c.liens.length ? `<div class="panel"><h3>Liens and reimbursement claims</h3><div class="table-wrap"><table><thead><tr><th>Holder</th><th>Type</th><th class="num">Asserted</th><th class="num">After reduction</th></tr></thead><tbody>${c.liens.map((l) => `<tr><td>${h(l.holder)}</td><td class="small" title="${h(D.LIEN_TYPES[l.type].desc)}">${h(D.LIEN_TYPES[l.type].name)}</td><td class="num">${M(l.amount)}</td><td class="num">${l.reduction != null ? M(l.amount - l.reduction) : '—'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      ${statement ? `<div class="panel"><h3>Settlement statement</h3><div class="table-wrap"><table><tr><td>Gross recovery</td><td class="num">${M(statement.gross)}</td></tr><tr><td>Attorney fee (${Math.round(c.feePct * 100)}%)${statement.feeCut ? ` <span class="small muted">reduced by ${M(statement.feeCut)}</span>` : ''}</td><td class="num">-${M(statement.feeNet)}</td></tr><tr><td>Case costs reimbursed</td><td class="num">-${M(statement.costs)}</td></tr><tr><td>Liens paid</td><td class="num">-${M(statement.liens)}</td></tr>${statement.referral ? `<tr><td>Referral fee to referring attorney</td><td class="num">-${M(statement.referral)}</td></tr>` : ''}<tr><th>Net to client</th><th class="num">${M(statement.net)}</th></tr></table></div><p class="small muted" style="margin-top:6px">${st.disbursed ? 'Funds disbursed.' : st.negotiating ? 'Lien negotiations in progress.' : `Settlement funds expected in about ${PI.weeksToText(Math.max(0, st.weeksToCheck))}.`}</p></div>` : ''}
      ${open ? `<div class="panel"><h3>Actions</h3><div class="actions">${regular.map(actBtn).join('')}</div>${actions.filter((a) => a.group === 'strategy').length ? `<div class="actions" style="margin-top:10px">${actions.filter((a) => a.group === 'strategy').map(actBtn).join('')}<span class="small muted">${h(actions.find((a) => a.group === 'strategy').desc)}</span></div>` : ''}${experts.length ? `<details style="margin-top:10px"><summary class="small">Experts (${experts.length} available)</summary><div class="actions" style="margin-top:8px">${experts.map(actBtn).join('')}</div></details>` : ''}<div class="actions" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">${manage.map(actBtn).join('')}</div></div>` : ''}

  U.drawCashChart = function (s, id) {
    const cv = document.getElementById(id || 'cash-chart');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const w = cv.width = cv.clientWidth * (window.devicePixelRatio || 1) || 600;
    const hgt = cv.height = 160 * (window.devicePixelRatio || 1);
    const cs = getComputedStyle(document.documentElement);
    const line = cs.getPropertyValue('--line').trim(), accent = cs.getPropertyValue('--accent').trim(), muted = cs.getPropertyValue('--muted').trim(), danger = cs.getPropertyValue('--danger').trim();
    const data = s.history.slice(-52);
    if (data.length < 2) { ctx.fillStyle = cs.getPropertyValue('--muted').trim(); ctx.font = `${12 * (window.devicePixelRatio || 1)}px ${cs.getPropertyValue('--font-ui')}`; ctx.fillText('The chart fills in as the weeks go by.', 12, 30 * (window.devicePixelRatio || 1)); return; }
    const vals = data.map((d) => d.cash - d.debt);
    let lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
    const pad = { l: 8, r: 8, t: 10, b: 20 };
    const X = (i) => pad.l + (i / (data.length - 1)) * (w - pad.l - pad.r);
    const Y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (hgt - pad.t - pad.b);
    ctx.clearRect(0, 0, w, hgt);
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let g = 0; g <= 3; g++) { const y = pad.t + g * (hgt - pad.t - pad.b) / 3; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke(); }
    const zy = Y(0);
    ctx.strokeStyle = muted; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(pad.l, zy); ctx.lineTo(w - pad.r, zy); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(X(0), Y(vals[0]));
    vals.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
    ctx.lineTo(X(vals.length - 1), zy); ctx.lineTo(X(0), zy); ctx.closePath();
    ctx.fillStyle = accent; ctx.globalAlpha = 0.15; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); vals.forEach((v, i) => (i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))));
    ctx.strokeStyle = vals[vals.length - 1] < 0 ? danger : accent; ctx.lineWidth = 2 * (window.devicePixelRatio || 1); ctx.stroke();
    ctx.fillStyle = muted; ctx.font = `${11 * (window.devicePixelRatio || 1)}px ${cs.getPropertyValue('--font-mono')}`;
    ctx.fillText(M(hi, { short: true }), pad.l + 4, pad.t + 12 * (window.devicePixelRatio || 1));
    ctx.fillText(M(lo, { short: true }), pad.l + 4, hgt - pad.b - 4);
    ctx.textAlign = 'right'; ctx.fillText('net of debt, ' + data.length + ' weeks', w - pad.r, hgt - 4);
  };

  Main.stop = function () { Main.playing = false; clearInterval(Main.timer); Main.timer = null; U.renderTopbar(); };
  Main.setSpeed = function (x) { Main.speed = x; if (Main.playing) { Main.stop(); Main.start(); } else U.renderTopbar(); };

  // ---------- Actions ----------
  const num = (id, fallback) => { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? fallback : v; };
  function openCase(id) { U.openCaseId = id; const c = U.state.cases.find((x) => x.id === id); if (c && c.pending && !c.delegated) U.modal = { type: c.pending.type, caseId: id }; U.renderAll(); }
  function afterAction() { Main.save(true); U.renderAll(); }
  function result(r, okMsg) { if (r && r.ok === false) U.toast(r.msg || 'Not possible right now.'); else if (okMsg) U.toast(okMsg); }

  const handlers = {
    tab(arg) { U.tab = arg; U.openCaseId = null; U.renderAll(); },
    advance() { if (Main.playing) Main.stop(); Main.advance(); },
    'toggle-play'() { Main.playing ? Main.stop() : Main.start(); },
    speed(arg) { Main.setSpeed(parseInt(arg, 10)); },
    menu() { U.modal = { type: 'menu' }; U.renderModal(); },
    'close-modal'() { U.modal = null; U.renderModal(); },
    'close-drawer'() { U.openCaseId = null; U.renderDrawer(); },
    'close-drawer-bg'(arg, el, ev) { if (ev.target === el) { U.openCaseId = null; U.renderDrawer(); } },
    'open-case'(arg) { openCase(arg); },
    'cases-filter'(arg) { U.caseFilter = arg; U.tab = 'cases'; U.renderAll(); },
    'log-filter'(arg) { U.logFilter = arg; U.renderTab(); },
    'show-event'(arg) { U.modal = { type: 'event', uid: arg }; U.renderModal(); },
    'event-opt'(arg, el) { F.resolveEvent(U.state, arg, parseInt(el.dataset.arg2, 10)); U.modal = null; afterAction(); },
    policy(arg, el) { const s = U.state; s.policy[arg] = el.checked; if (arg === 'autoIntake' && el.checked) F.autoIntake(s); afterAction(); },
    strategy(arg, el) { U.state.strategy[arg] = el.dataset.arg2; afterAction(); },
    help() { U.modal = { type: 'help' }; U.renderModal(); },
    // Intake
    'sign-lead'(arg) { const s = U.state; const sel = document.querySelector(`select[data-role="assign-${arg}"]`); const c = F.signLead(s, arg, sel ? sel.value : null); if (c) { U.toast(`${c.clientName} signed. Assigned to ${F.staffById(s, c.attorneyId).name}.`); } afterAction(); },
    'decline-lead'(arg) { F.declineLead(U.state, arg); afterAction(); },
    'refer-lead'(arg) { F.referLead(U.state, arg); afterAction(); },
    'investigate-lead'(arg) { F.investigateLead(U.state, arg); afterAction(); },
    // Case actions
    'case-act'(arg) {
      const s = U.state; const c = s.cases.find((x) => x.id === U.openCaseId); if (!c) return;
      if (arg === 'demand' || arg === 'respond' || arg === 'liens') { U.modal = { type: arg === 'respond' ? 'offer' : arg, caseId: c.id }; U.renderModal(); return; }
      if (arg === 'withdraw') { U.modal = { type: 'confirm', title: 'Withdraw from representation?', text: `Drop ${c.clientName}'s case. ${PI.money(c.costs)} in advanced costs is written off.`, yes: 'Withdraw', onYes: () => { C.act(s, c, 'withdraw'); U.openCaseId = null; } }; U.renderModal(); return; }
      if (arg === 'file') { U.modal = { type: 'confirm', title: 'File suit?', text: `File a complaint for ${c.clientName}. The fee converts to 40%, you pay the filing fee, and litigation typically runs one to two years before trial.`, yes: 'File the complaint', onYes: () => { if (!C.fileSuit(s, c)) U.toast('Cannot file yet.'); } }; U.renderModal(); return; }
      if (arg === 'reopen') { const est = C.estimate(s, c); C.act(s, c, 'reopen', { amount: Math.round(est.mid * 1.4 / 1000) * 1000 }); afterAction(); return; }
      const ok = C.act(s, c, arg);
      if (!ok) U.toast('That is not available right now.');
      afterAction();
    },
    'assign-case'(arg, el) { F.assignCase(U.state, arg, el.value); afterAction(); },
    preset(arg) { const i = document.getElementById('demand-amt'); if (i) i.value = arg; },
    'send-demand'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); const amt = num('demand-amt', 0); if (!c || amt < 1000) { U.toast('Enter a demand amount.'); return; } const tl = document.getElementById('demand-tl'); C.act(s, c, 'demand', { amount: amt, timeLimited: !!(tl && tl.checked) }); U.modal = null; afterAction(); },
    'offer-accept'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); C.act(s, c, 'accept'); U.modal = c.pending && c.pending.type === 'liens' ? { type: 'liens', caseId: c.id } : null; afterAction(); },
    'offer-counter'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); const amt = num('counter-amt', 0); if (amt <= (c.negotiation.currentOffer || 0)) { U.toast('A counter has to be above the offer.'); return; } C.act(s, c, 'counter', { amount: amt }); U.modal = null; afterAction(); },
    'offer-escalate'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); C.act(s, c, 'escalate'); U.modal = null; afterAction(); },
    'offer-file'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); if (C.fileSuit(s, c)) { U.modal = null; U.toast('Complaint filed.'); } else U.toast('Cannot file yet.'); afterAction(); },
    'offer-reject'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); C.act(s, c, 'reject'); U.modal = null; afterAction(); },
    'liens-negotiate'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); C.act(s, c, 'liens', { negotiate: true }); U.modal = null; afterAction(); },
    'liens-pay'(arg) { const s = U.state; const c = s.cases.find((x) => x.id === arg); C.act(s, c, 'liens', { negotiate: false }); U.modal = null; afterAction(); },
    'confirm-yes'() { const m = U.modal; U.modal = null; if (m && m.onYes) m.onYes(); afterAction(); },
    // Staff
    hire(arg) { result(F.hire(U.state, arg)); afterAction(); },
    fire(arg) { const st = F.staffById(U.state, arg); U.modal = { type: 'confirm', title: `Let ${st.name} go?`, text: `One month of severance (${PI.money(Math.round(st.salary / 12))}). Their cases are reassigned and the rest of the team notices.`, yes: 'Let go', onYes: () => F.fire(U.state, arg) }; U.renderModal(); },
    raise(arg) { F.raise(U.state, arg, 0.1); afterAction(); },
    bonus(arg) { F.bonus(U.state, arg, 2500); afterAction(); },
    train(arg) { U.modal = { type: 'train', staffId: arg }; U.renderModal(); },
    'train-skill'(arg, el) { result(F.train(U.state, arg, el.dataset.arg2)); U.modal = null; afterAction(); },
    promote(arg) { F.promote(U.state, arg); afterAction(); },
    successor(arg) { result(F.nameSuccessor(U.state, arg)); afterAction(); },
    retire() { U.modal = { type: 'confirm', title: 'Retire now?', text: 'You hand the firm to your successor and the next generation begins. You keep playing as the new managing partner.', yes: 'Retire', onYes: () => F.retireNow(U.state) }; U.renderModal(); },
    'delegate-all'() { for (const c of F.openCases(U.state)) { c.delegated = true; if (c.pending) C.autoPilot(U.state, c); } afterAction(); },
    'handson-all'() { for (const c of F.openCases(U.state)) c.delegated = false; afterAction(); },
    // Marketing / office / finance
    channel(arg, el) { result(F.setChannel(U.state, arg, parseInt(el.dataset.arg2, 10))); afterAction(); },
    office(arg) { result(F.upgradeOffice(U.state, parseInt(arg, 10))); afterAction(); },
    'open-office'(arg) { result(F.openOffice(U.state, arg)); afterAction(); },
    borrow() { F.borrow(U.state, num('loan-amt', 0)); afterAction(); },
    repay() { F.repay(U.state, num('loan-amt', 0)); afterAction(); },
    'set-draw'() { U.state.founderDraw = Math.max(0, num('draw-amt', 0)); afterAction(); },
    // Menu
    save() { Main.save(); },
    export() { const text = F.serialize(U.state); const done = () => U.toast('Save copied to clipboard.'); const fallback = () => { const ta = document.getElementById('import-text'); if (ta) { ta.value = text; ta.select(); } U.toast('Clipboard blocked; the save is in the text box below. Copy it from there.'); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); },
    'show-import'() { const ta = document.getElementById('import-text'); if (ta) ta.focus(); },
    import() { const ta = document.getElementById('import-text'); try { U.state = F.deserialize(ta.value.trim()); U.modal = null; U.openCaseId = null; Main.save(true); U.renderAll(); U.toast('Save imported.'); } catch (e) { U.toast('That is not a valid save.'); } },
    'new-game-confirm'() { U.modal = { type: 'confirm', title: 'Start a new firm?', text: 'The current game is abandoned. The autosave is replaced when the new firm plays its first week.', yes: 'New firm', onYes: () => Main.newGameScreen() }; U.renderModal(); },
    'new-game'() { Main.stop(); U.modal = null; Main.newGameScreen(); },
    continue() { if (Main.load()) Main.enterGame(); },
    'ng-bg'(arg) { U.ng.backgroundId = arg; captureNg(); U.renderNewGame(Main.hasSave()); },
    'ng-city'(arg) { U.ng.cityId = arg; captureNg(); U.renderNewGame(Main.hasSave()); },
    'ng-start'() {
      captureNg();
      const founder = U.ng.founderName.trim() || 'Jordan Reyes';
      const firm = U.ng.firmName.trim() || `${founder.split(' ').slice(-1)[0]} Injury Law`;
      U.state = F.newGame({ founderName: founder, firmName: firm, backgroundId: U.ng.backgroundId, cityId: U.ng.cityId, seed: Math.floor(Math.random() * 2 ** 31) });
      U.tab = 'dashboard'; U.caseFilter = 'attention'; U.openCaseId = null; U.modal = null;
      Main.save(true);
      Main.enterGame();
      U.modal = { type: 'help' }; U.renderModal(); U.toast('Welcome to the practice of law. Three files came with you.');
    }
  };
  function captureNg() { const f = document.getElementById('ng-founder'), fi = document.getElementById('ng-firm'); if (f) U.ng.founderName = f.value; if (fi) U.ng.firmName = fi.value; }

  Main.newGameScreen = function () { Main.stop(); U.state = null; U.modal = null; U.openCaseId = null; $('#drawer-root').hidden = true; $('#drawer-root').innerHTML = ''; $('#modal-root').hidden = true; $('#modal-root').innerHTML = ''; U.renderNewGame(Main.hasSave()); };
  Main.enterGame = function () { shell(); Main.playing = false; U.renderAll(); if (U.state.gameOver) { U.modal = { type: 'gameover' }; U.renderModal(); } };

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // handled on change
    const act = el.dataset.act;
    const fn = handlers[act];
    if (!fn) return;
    if (el.tagName === 'BUTTON' && el.disabled) return;
    try { fn(el.dataset.arg, el, ev); } catch (e) { console.error(e); U.toast('Something went wrong: ' + e.message); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || !(el.tagName === 'INPUT' || el.tagName === 'SELECT')) return;
    const fn = handlers[el.dataset.act];
    if (fn) { try { fn(el.dataset.arg, el, ev); } catch (e) { console.error(e); U.toast('Something went wrong: ' + e.message); } }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.target.matches('input, textarea, select')) return;
    if (ev.key === 'Escape') { if (U.modal && U.modal.type !== 'gameover') { U.modal = null; U.renderModal(); } else if (U.openCaseId) { U.openCaseId = null; U.renderDrawer(); } }
    if (ev.key === 'n' && U.state && !U.modal) handlers.advance();
    if (ev.key === ' ' && U.state && !U.modal) { ev.preventDefault(); handlers['toggle-play'](); }
  });

  Main.boot = function () {
    const start = () => {
      if (Main.load()) { shell(); U.renderAll(); if (U.state.gameOver) { U.modal = { type: 'gameover' }; U.renderModal(); } }
      else U.renderNewGame(false);
    };
    if (globalThis.claude && globalThis.claude.hot && globalThis.claude.hot.ready) globalThis.claude.hot.ready(start); else start();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Main.boot); else Main.boot();
})();

</script>
</body>
</html>
